server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression (optional but recommended for Vite)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json;

    # Serve static assets with a long cache lifetime
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # CRITICAL FIX FOR SPA ROUTING:
    # Try to serve the requested file (e.g., /assets/logo.svg).
    # If the file doesn't exist, serve /index.html instead.
    location / {
        try_files $uri $uri/ /index.html;
    }
}