services:
    app:
        build: .
        ports:
            - "5173:5173"
        environment:
            - NODE_ENV=production
            - PORT=5173
        networks:
            - app-network
        restart: unless-stopped
        healthcheck:
            test: ["CMD", "node", "-e", "require('http').get('http://localhost:8080', (res) => { process.exit(res.statusCode === 200 ? 0 : 1) })"]


networks:
  app-network:
      driver: bridge     